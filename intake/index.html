<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outfox KB — Document Intake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <span class="logo">Outfox</span>
      <span class="header-title">Knowledge Base — Document Intake</span>
    </div>
  </header>

  <main>
    <div class="container">

      <form id="intake-form" novalidate autocomplete="off">

        <!-- ── Document Title ─────────────────────────────── -->
        <section class="form-section">
          <h2 class="section-heading">Document</h2>

          <div class="field" id="field-title">
            <label for="title">Document Title <span class="required">*</span></label>
            <input type="text" id="title" name="title" placeholder="e.g. Acme Corp Discovery Session — March 2025">
            <span class="field-error" id="error-title"></span>
          </div>
        </section>

        <!-- ── Metadata ───────────────────────────────────── -->
        <section class="form-section">
          <h2 class="section-heading">Metadata <span class="optional-label">optional</span></h2>

          <div class="field-row">
            <div class="field">
              <label for="category">Category</label>
              <select id="category" name="category">
                <option value="">— select —</option>
                <option value="Client Engagements">Client Engagements</option>
                <option value="Industry Research">Industry Research</option>
                <option value="Methodologies &amp; Frameworks">Methodologies &amp; Frameworks</option>
                <option value="Case Studies">Case Studies</option>
                <option value="Internal Operations">Internal Operations</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="field">
              <label for="subcategory">Subcategory</label>
              <input type="text" id="subcategory" name="subcategory" placeholder="e.g. Change Management">
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="industry">Industry</label>
              <input type="text" id="industry" name="industry" placeholder="e.g. Healthcare, Manufacturing">
            </div>

            <div class="field">
              <label for="doc_type">Document Type</label>
              <select id="doc_type" name="doc_type">
                <option value="">— select —</option>
                <option value="transcript">Transcript</option>
                <option value="SOP">SOP</option>
                <option value="reference">Reference</option>
                <option value="case study">Case Study</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="source">Source</label>
            <input type="text" id="source" name="source" placeholder="URL, filename, or meeting reference">
          </div>
        </section>

        <!-- ── Content ────────────────────────────────────── -->
        <section class="form-section">
          <h2 class="section-heading">Content <span class="required">*</span></h2>
          <p class="section-hint">Paste text directly or upload a file. Only one input is active at a time.</p>

          <div class="field" id="field-content">
            <label for="content-text">Paste document text</label>
            <textarea
              id="content-text"
              name="content"
              rows="10"
              placeholder="Paste the document content here…"
            ></textarea>
            <span class="char-count" id="char-count"></span>
            <span class="field-error" id="error-content"></span>
          </div>

          <div class="divider-or"><span>or</span></div>

          <div class="field upload-field" id="field-upload">
            <label for="file-upload">Upload a file</label>
            <div class="upload-zone" id="upload-zone">
              <input type="file" id="file-upload" name="file" accept=".txt,.md,.pdf">
              <div class="upload-prompt" id="upload-prompt">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span>Choose file or drag and drop</span>
                <span class="upload-hint">.txt · .md · .pdf — max 10 MB</span>
              </div>
              <div class="file-status" id="file-status" hidden>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span id="file-status-text"></span>
                <button type="button" class="remove-file" id="remove-file" aria-label="Remove file">✕</button>
              </div>
            </div>
            <span class="field-error" id="error-file"></span>
          </div>
        </section>

        <!-- ── Processing Mode ────────────────────────────── -->
        <section class="form-section">
          <h2 class="section-heading">Processing Mode</h2>
          <p class="section-hint">Choose how the content is prepared before embedding.</p>

          <div class="mode-toggle" role="radiogroup" aria-label="Processing mode">
            <label class="mode-option" id="mode-distill">
              <input type="radio" name="processing_mode" value="distill" checked>
              <div class="mode-card">
                <div class="mode-title">Distill First</div>
                <div class="mode-desc">Claude reads the raw content and restructures it into a clean, well-formed document before chunking. Best for transcripts and messy input.</div>
              </div>
            </label>

            <label class="mode-option" id="mode-direct">
              <input type="radio" name="processing_mode" value="direct">
              <div class="mode-card">
                <div class="mode-title">Direct to Chunking</div>
                <div class="mode-desc">Content is chunked and embedded as-is, without distillation. Best for already-clean documents like SOPs or formatted case studies.</div>
              </div>
            </label>
          </div>
        </section>

        <!-- ── Submit ─────────────────────────────────────── -->
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="submit-btn">
            Process Document
          </button>
        </div>

      </form>
    </div>
  </main>

  <script src="app.js"></script>

</body>
</html>
